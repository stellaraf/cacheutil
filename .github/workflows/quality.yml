name: Quality
on: [push, pull_request]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: supercharge/redis-github-action@1.4.0
        with:
          redis-version: 6

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 19

      - uses: pnpm/action-setup@v2
        with:
          version: 6.0.2
          run_install: true

      - name: Lint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Jest
        run: pnpm run test
